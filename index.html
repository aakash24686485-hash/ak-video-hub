<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK Video Hub</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px;
  background: #19263a;
  font-size: 25px;
  font-weight: bold;
}
.search {
  padding: 20px;
}
input {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  border: none;
}
h2 { padding: 0 20px; }
.categories {
  padding: 10px 20px;
  color: #9db9ff;
}
.videos {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 20px;
}
.video {
  background: #24334a;
  padding: 12px;
  border-radius: 10px;
}
.thumbnail {
  background: #344a68;
  height: 110px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 35px;
}
@media(max-width:500px) {
  .videos { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>▶ AK Video Hub</header>

<div class="search">
<input type="text" placeholder="Search videos...">
</div>

<div class="categories">
All Videos | Stories | Entertainment | Knowledge
</div>

<div style="padding:20px;">
  <h2>Upload Your Video</h2>
  <input type="file" id="videoUpload" accept="video/mp4,video/webm">
  <video id="videoPlayer" controls
    style="width:100%; max-width:600px; display:none; margin-top:15px;">
  </video>
</div>

<h2>Latest Videos</h2>

<div class="videos">
  <div class="video">
    <div class="thumbnail">🎬</div>
    <h3>Mystery Story</h3>
  </div>
  <div class="video">
    <div class="thumbnail">🌄</div>
    <h3>Amazing Nature</h3>
  </div>
  <div class="video">
    <div class="thumbnail">🌌</div>
    <h3>Space Mystery</h3>
  </div>
  <div class="video">
    <div class="thumbnail">🏰</div>
    <h3>History Videos</h3>
  </div>
</div>

<script>
const searchBox = document.querySelector('input');
const videos = document.querySelectorAll('.video');

searchBox.addEventListener('input', function() {
  const searchText = this.value.toLowerCase();

  videos.forEach(function(video) {
    const title = video.innerText.toLowerCase();

    video.style.display = title.includes(searchText)
      ? 'block'
      : 'none';
  });
});
</script>

<script>
const uploader = document.getElementById('videoUpload');
const player = document.getElementById('videoPlayer');

uploader.addEventListener('change', function() {
  const file = this.files[0];

  if (file) {
    player.src = URL.createObjectURL(file);
    player.style.display = 'block';
    player.play();
  }
});
</script>

</body>
</html>
